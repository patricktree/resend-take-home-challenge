packages:
  - apps/*
  - libs/*
  - qa/*
  - tooling/*
  # Opt in to additional .patricktree-stack projects only when the consuming repo uses them.
  - .patricktree-stack/tooling/config-oxfmt
  - .patricktree-stack/tooling/config-oxlint
  - .patricktree-stack/tooling/config-playwright
  - .patricktree-stack/tooling/config-turbo-typescript
  - .patricktree-stack/tooling/config-typescript
  - .patricktree-stack/tooling/config-vitest
  - .patricktree-stack/tooling/config-wyw-in-js

allowBuilds:
  # its postinstall script only prints a funding notice (a dependency of "agents" through mimetext)
  core-js-pure: false
  esbuild: true
  unrs-resolver: true
  workerd: true

catalog:
  # keep in step with the Playwright Docker image, whose tag the e2e configuration derives from it
  "@playwright/test": 1.64.0
  "@types/node": ^26.6.5
  "@typescript/native": "npm:typescript@^7.0.2"
  # keep the runner and its coverage provider on the same exact version (coverage-v8 has an exact peer dependency on vitest)
  "@vitest/coverage-v8": 4.1.11
  oxfmt: ^0.72.0
  oxlint: ^1.87.0
  oxlint-tsgolint: ^7.0.2004
  # keep on the version vite resolves (it bundles with Rolldown internally), so the workspace installs one Rolldown
  rolldown: 1.2.14
  typescript: "npm:@typescript/typescript6@^6.0.2"
  vite: ^8.3.4
  vitest: 4.1.11
  wrangler: ~4.144.0

catalogs:
  hono:
    "@hono/zod-openapi": ^1.6.3
    hono: ^4.13.13
  mcp:
    # agents names the MCP SDK packages as exact peer dependencies: keep them on the versions it names
    "@modelcontextprotocol/client": 2.3.1
    "@modelcontextprotocol/server": 2.3.1
    agents: 0.28.1
  web-app:
    # keep in step with the wrangler version in the default catalog (both bundle workerd/miniflare)
    "@cloudflare/vite-plugin": 1.62.2
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.2
    "@wyw-in-js/vite": ^2.5.1
    react: ^19.3.0
    react-dom: ^19.3.0
    vite: ^8.3.4

packageExtensions:
  eslint-plugin-react-you-might-not-need-an-effect@1.0.2:
    # "eslint-plugin-react-you-might-not-need-an-effect" defines eslint as peer dependency, but that is not required when used by oxlint --> make it optional
    peerDependenciesMeta:
      eslint:
        optional: true
  agents@0.28.1:
    # "agents" defines MCP SDK v1 as peer dependency, but only its deprecated McpAgent and v1 client code import it; "agents/mcp/server" runs on SDK v2 --> make it optional
    peerDependenciesMeta:
      "@modelcontextprotocol/sdk":
        optional: true
    # the Babel and Rolldown packages that "agents" depends on for its Vite plugin ("agents/vite") need these peer dependencies, which "agents" does not provide --> provide them
    dependencies:
      "@babel/core": ^8.0.7
      rolldown: ^1.2.14

# handle peer dependencies in a strict way
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
strictPeerDependencies: true
dedupePeerDependents: false

# enforce specific Node.js and pnpm version (https://pnpm.io/npmrc#engine-strict)
engineStrict: true

# disable update notifier (https://pnpm.io/npmrc#update-notifier)
updateNotifier: false

# workspace-concurrency=0 will use amount of cores of the host to run tasks concurrently (https://pnpm.io/cli/recursive#--workspace-concurrency)
workspaceConcurrency: 0

minimumReleaseAgeExclude:
  - miniflare@5.20260815.0-alpha || 5.20260921.0-alpha
  - wrangler@4.124.0 || 4.136.1
  - '@cloudflare/unenv-preset@2.16.2'
